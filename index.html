<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>놀이동산 따라말하기 검사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;background:#F0F7FF;min-height:100vh;display:flex;align-items:center;justify-content:center}
.phone{width:390px;min-height:700px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.15)}
:root{--sky:#4A9EE8;--sky-dark:#1E6FC8;--sky-light:#D6EDFB;--green:#34C77B;--red:#E24B4A;--gray:#888}
.top-bar{background:var(--sky);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.top-title{color:#fff;font-size:15px;font-weight:600}
.top-sub{color:rgba(255,255,255,0.82);font-size:11px;margin-top:1px}
.tabs{display:flex;background:var(--sky-light);border-bottom:1px solid rgba(74,158,232,0.2)}
.tab{flex:1;padding:8px 4px;font-size:11px;text-align:center;color:var(--sky-dark);cursor:pointer;border-bottom:3px solid transparent;transition:all 0.15s;font-weight:500}
.tab.active{border-bottom-color:var(--sky);color:var(--sky);background:#fff}
.content{padding:12px}
.info-box{background:#fff;border:1px solid rgba(74,158,232,0.25);border-radius:14px;padding:13px 14px;margin-bottom:10px;min-height:90px}
.box-label{font-size:10px;color:var(--gray);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.badge{background:var(--sky);color:#fff;border-radius:20px;font-size:10px;padding:1px 8px;font-weight:500}
.sentence{font-size:17px;font-weight:600;color:#222;line-height:1.65;letter-spacing:0.02em}
.sentence-sub{font-size:12px;color:#888;margin-top:3px}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{background:#EEF6FF;border-radius:20px;padding:2px 10px;font-size:11px;color:var(--sky-dark)}
.dots{display:flex;justify-content:center;gap:7px;padding:6px 0}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(74,158,232,0.2);transition:all 0.2s;cursor:pointer}
.dot.active{background:var(--sky);transform:scale(1.25)}
.dot.done{background:var(--green)}
.status-bar{background:var(--sky-light);padding:5px 14px;font-size:11px;color:#555;display:flex;align-items:center;gap:5px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.status-dot.rec{background:var(--red);animation:blink 1s infinite}
.status-dot.play{background:#EF9F27;animation:blink 0.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.btn-row{display:flex;justify-content:space-around;align-items:center;padding:10px 12px 6px;background:var(--sky-light)}
.nav-btn{width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid rgba(74,158,232,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;color:var(--sky-dark);transition:all 0.15s}
.nav-btn:active{transform:scale(0.9)}
.nav-btn.disabled{opacity:0.28;pointer-events:none}
.action-btn{width:64px;height:64px;border-radius:50%;background:var(--sky);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#fff;transition:all 0.15s;position:relative}
.action-btn.rec-active{background:var(--red);animation:pulse 1.2s infinite}
.action-btn.rec-done{background:var(--green)}
.action-btn:active{transform:scale(0.92)}
.btn-wrap{display:flex;flex-direction:column;align-items:center}
.btn-label{font-size:10px;color:#666;margin-top:3px;white-space:nowrap}
.small-btn{width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid rgba(74,158,232,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:21px;color:var(--sky-dark);transition:all 0.15s}
.small-btn:active{transform:scale(0.9)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,75,74,0.35)}50%{box-shadow:0 0 0 8px rgba(226,75,74,0)}}
.score-panel{background:#fff;border:1px solid rgba(74,158,232,0.2);border-radius:14px;margin-bottom:8px;overflow:hidden}
.score-header{background:#F5F9FF;padding:7px 12px;font-size:11px;font-weight:600;color:#555;border-bottom:1px solid rgba(74,158,232,0.15);display:flex;justify-content:space-between}
.score-grid{display:grid;grid-template-columns:1fr 1fr}
.score-cell{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,0.05)}
.score-cell:nth-child(odd){border-right:1px solid rgba(0,0,0,0.05)}
.score-lbl{font-size:10px;color:#888;margin-bottom:4px}
.counter{display:flex;align-items:center;gap:5px}
.cnt-btn{width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#F5F5F5;cursor:pointer;font-size:18px;color:#555;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.cnt-btn:active{transform:scale(0.88);background:#ddd}
.cnt-num{font-size:19px;font-weight:700;color:#222;min-width:22px;text-align:center}
.cnt-tot{font-size:11px;color:#aaa}
.memo-box{background:#fff;border:1px solid rgba(74,158,232,0.2);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.memo-box label{font-size:11px;color:#888;display:block;margin-bottom:5px}
.memo-box textarea{width:100%;border:none;outline:none;font-size:13px;color:#333;resize:none;font-family:inherit;background:transparent}
.result-screen{display:none;padding:12px}
.result-screen.show{display:block}
.result-title{font-size:16px;font-weight:700;text-align:center;color:#222;margin-bottom:12px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{background:var(--sky);color:#fff;padding:8px 6px;font-weight:600}
.rtable td{padding:7px 6px;border-bottom:1px solid #eee;text-align:center;color:#333}
.rtable tr:nth-child(even) td{background:#F8FBFF}
.rtable .total td{font-weight:700;background:var(--sky-light)!important;color:var(--sky-dark)!important}
.result-actions{display:flex;gap:8px;margin-top:12px}
.rbtn{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:13px;font-weight:500}
.rbtn.pri{background:var(--sky);color:#fff;border-color:var(--sky)}
.rbtn:active{transform:scale(0.97)}
</style>
</head>
<body>
<div class="phone">
  <div id="mainView">
    <div class="top-bar">
      <div><div class="top-title">놀이동산 따라말하기 검사</div><div class="top-sub" id="topSub">도입</div></div>
      <div class="nav-btn" id="resultOpenBtn" style="width:40px;height:40px;font-size:18px;background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4);color:#fff" title="결과">&#128203;</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="dots" id="dots"></div>
    <div class="content">
      <div class="info-box">
        <div class="box-label"><span class="badge" id="itemBadge">-</span><span id="itemProg"></span></div>
        <div class="sentence" id="sentText"></div>
        <div class="sentence-sub" id="sentSub"></div>
        <div class="chips" id="sentChips"></div>
      </div>
    </div>
    <div class="status-bar"><div class="status-dot" id="sDot"></div><span id="sTxt">준비</span></div>
    <div class="btn-row">
      <div class="btn-wrap"><div class="nav-btn" id="prevBtn" onclick="nav(-1)">&#8592;</div><div class="btn-label">이전</div></div>
      <div class="btn-wrap"><div class="small-btn" id="replayBtn" onclick="playPrompt()">&#8635;</div><div class="btn-label">지시문</div></div>
      <div class="btn-wrap"><div class="action-btn" id="recBtn" onclick="toggleRec()">&#127908;</div><div class="btn-label" id="recLbl">녹음 시작</div></div>
      <div class="btn-wrap"><div class="small-btn" onclick="playRec()">&#9654;</div><div class="btn-label">재생</div></div>
      <div class="btn-wrap"><div class="nav-btn" id="nextBtn" onclick="nav(1)">&#8594;</div><div class="btn-label">다음</div></div>
    </div>
    <div class="content" style="padding-top:4px">
      <div class="score-panel" id="scorePanel" style="display:none">
        <div class="score-header"><span>오류 반응 기록</span><span id="scorePanelLbl" style="color:var(--sky)"></span></div>
        <div class="score-grid">
          <div class="score-cell"><div class="score-lbl">어절 오류</div>
            <div class="counter"><div class="cnt-btn" onclick="chg('e',-1)">&#8722;</div><div class="cnt-num" id="eNum">0</div><div class="cnt-tot" id="eTot">/4</div><div class="cnt-btn" onclick="chg('e',1)">+</div></div></div>
          <div class="score-cell"><div class="score-lbl">낱말 오류</div>
            <div class="counter"><div class="cnt-btn" onclick="chg('w',-1)">&#8722;</div><div class="cnt-num" id="wNum">0</div><div class="cnt-tot" id="wTot">/6</div><div class="cnt-btn" onclick="chg('w',1)">+</div></div></div>
        </div>
      </div>
      <div class="memo-box">
        <label>전사 메모 (아동 반응)</label>
        <textarea id="memoArea" rows="2" placeholder="아동의 반응을 철자법으로 기록..."></textarea>
      </div>
    </div>
  </div>
  <div class="result-screen" id="resultView">
    <div class="result-title">&#128203; 검사 결과</div>
    <table class="rtable"><thead><tr><th>문항</th><th>어절 오류</th><th>낱말 오류</th><th>메모</th></tr></thead><tbody id="rtbody"></tbody></table>
    <div class="result-actions">
      <button class="rbtn" onclick="showMain()">&#8592; 돌아가기</button>
      <button class="rbtn pri" onclick="copyResult()">결과 복사</button>
    </div>
  </div>
</div>

<script>
const BASE = 'audio/';
const SECTIONS = [
  { id:'intro', label:'도입', items:[
    { key:'0_0_intro', text:'검사 소개', sub:'', badge:'도입', scorable:false }
  ]},
  { id:'practice', label:'연습', items:[
    { key:'1_0_practice_0', text:'연습 1', sub:'', badge:'연습 1', scorable:false },
    { key:'1_1_practice_1', text:'연습 2', sub:'', badge:'연습 2', scorable:false },
  ]},
  { id:'sentence', label:'따라말하기', items:[
    { key:'2_0_sentence_0', text:'자동차를 타고 놀이동산에 갔어요', sub:'+ 가쩐', badge:'문장 1', scorable:true, eMax:4, wMax:6 },
    { key:'2_1_sentence_1', text:'호랑이 코끼리 사슴 같은 동물 친구들도 있었어요', sub:'', badge:'문장 2', scorable:true, eMax:7, wMax:8 },
    { key:'2_2_sentence_2', text:'왕자님 공주님이 된 것처럼 우리는 신이 났어요', sub:'', badge:'문장 3', scorable:true, eMax:7, wMax:11 },
  ]},
  { id:'picture', label:'그림설명', items:[
    { key:'3_0_picture_intro', text:'그림 설명 소개', sub:'', badge:'안내', scorable:false },
    { key:'3_1_picture_0', text:'그림 설명 1', sub:'', badge:'그림 1', scorable:false },
    { key:'3_2_picture_1', text:'그림 설명 2', sub:'', badge:'그림 2', scorable:false },
    { key:'3_3_picture_2', text:'그림 설명 3', sub:'', badge:'그림 3', scorable:false },
  ]},
  { id:'short', label:'짧은문장', items:[
    { key:'4_0_short_intro', text:'짧은 문장 소개', sub:'', badge:'안내', scorable:false },
    { key:'4_1_short_0', text:'짧은 문장 1', sub:'', badge:'짧은 1', scorable:false },
    { key:'4_2_short_1', text:'짧은 문장 2', sub:'', badge:'짧은 2', scorable:false },
    { key:'4_3_short_2', text:'짧은 문장 3', sub:'', badge:'짧은 3', scorable:false },
    { key:'4_4_short_3', text:'짧은 문장 4', sub:'', badge:'짧은 4', scorable:false },
    { key:'4_5_short_4', text:'짧은 문장 5', sub:'', badge:'짧은 5', scorable:false },
    { key:'4_6_short_5', text:'짧은 문장 6', sub:'', badge:'짧은 6', scorable:false },
  ]},
  { id:'read', label:'읽기', items:[
    { key:'5_0_read_0', text:'읽기 1', sub:'', badge:'읽기 1', scorable:false },
    { key:'5_0_read_1', text:'읽기 2', sub:'', badge:'읽기 2', scorable:false },
  ]},
];

const ALL = [];
SECTIONS.forEach((sec,si) => sec.items.forEach((item,ii) => {
  ALL.push({...item, secId:sec.id, secLabel:sec.label, secIdx:si, itemIdx:ii});
}));

let cur=0, scores={}, memos={}, recordings={}, isRec=false, mediaRec=null, chunks=[], curAudio=null;

function buildTabs(){
  document.getElementById('tabs').innerHTML = SECTIONS.map((s,i)=>
    `<div class="tab" id="tab_${s.id}" onclick="jumpSec(${i})">${s.label}</div>`).join('');
}
function jumpSec(si){
  const idx=ALL.findIndex(it=>it.secIdx===si);
  if(idx>=0){cur=idx;render();}
}
function buildDots(){
  const it=ALL[cur];
  const sec=ALL.filter(x=>x.secIdx===it.secIdx);
  document.getElementById('dots').innerHTML=sec.map((x,i)=>{
    const gi=ALL.indexOf(x);
    let c='dot'+(gi<cur?' done':gi===cur?' active':'');
    return `<div class="${c}" onclick="cur=${gi};render()"></div>`;
  }).join('');
}
function render(){
  const it=ALL[cur];
  document.getElementById('topSub').textContent=it.secLabel;
  document.getElementById('itemBadge').textContent=it.badge;
  document.getElementById('itemProg').textContent=`${it.itemIdx+1} / ${ALL.filter(x=>x.secIdx===it.secIdx).length}`;
  document.getElementById('sentText').textContent=it.text;
  document.getElementById('sentSub').textContent=it.sub||'';
  document.getElementById('sentChips').innerHTML=it.scorable?
    `<span class="chip">어절 /${it.eMax}</span><span class="chip">낱말 /${it.wMax}</span>`:'';
  const sp=document.getElementById('scorePanel');
  if(it.scorable){
    sp.style.display='block';
    const s=scores[it.key]||{e:0,w:0};
    document.getElementById('eNum').textContent=s.e;
    document.getElementById('wNum').textContent=s.w;
    document.getElementById('eTot').textContent='/'+it.eMax;
    document.getElementById('wTot').textContent='/'+it.wMax;
    document.getElementById('scorePanelLbl').textContent=it.badge;
  } else sp.style.display='none';
  document.getElementById('memoArea').value=memos[it.key]||'';
  document.getElementById('prevBtn').className='nav-btn'+(cur===0?' disabled':'');
  document.getElementById('nextBtn').className='nav-btn'+(cur===ALL.length-1?' disabled':'');
  SECTIONS.forEach(s=>{
    const el=document.getElementById('tab_'+s.id);
    if(el) el.className='tab'+(s.id===it.secId?' active':'');
  });
  buildDots();
  setStatus('준비');
  const btn=document.getElementById('recBtn');
  btn.className='action-btn'+(recordings[it.key]?' rec-done':'');
  btn.innerHTML=recordings[it.key]?'&#10003;':'&#127908;';
  document.getElementById('recLbl').textContent=recordings[it.key]?'재녹음':'녹음 시작';
}
function setStatus(txt,mode){
  document.getElementById('sTxt').textContent=txt;
  document.getElementById('sDot').className='status-dot'+(mode==='rec'?' rec':mode==='play'?' play':'');
}
function nav(d){
  document.getElementById('memoArea') && (memos[ALL[cur].key]=document.getElementById('memoArea').value);
  const n=cur+d;
  if(n<0||n>=ALL.length)return;
  if(isRec)stopRec();
  if(curAudio){curAudio.pause();curAudio=null;}
  cur=n; render();
}
function playPrompt(){
  if(curAudio){curAudio.pause();curAudio=null;}
  const key=ALL[cur].key;
  curAudio=new Audio(BASE+key+'.wav');
  setStatus('지시문 재생 중...','play');
  curAudio.play().catch(()=>setStatus('재생 오류'));
  curAudio.onended=()=>setStatus('준비');
}
async function toggleRec(){
  if(!isRec){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];
      mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      mediaRec.onstop=()=>{
        const blob=new Blob(chunks,{type:'audio/webm'});
        const url=URL.createObjectURL(blob);
        const old=recordings[ALL[cur].key];
        if(old)URL.revokeObjectURL(old.url);
        recordings[ALL[cur].key]={blob,url};
        setStatus('녹음 저장 완료 ✓');
        const btn=document.getElementById('recBtn');
        btn.className='action-btn rec-done'; btn.innerHTML='&#10003;';
        document.getElementById('recLbl').textContent='재녹음';
        stream.getTracks().forEach(t=>t.stop());
        isRec=false;
      };
      mediaRec.start(); isRec=true;
      const btn=document.getElementById('recBtn');
      btn.className='action-btn rec-active'; btn.innerHTML='&#9632;';
      document.getElementById('recLbl').textContent='녹음 종료';
      setStatus('녹음 중...','rec');
    }catch(e){setStatus('마이크 접근 불가');}
  }else stopRec();
}
function stopRec(){if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();}
function playRec(){
  const r=recordings[ALL[cur].key];
  if(!r){setStatus('저장된 녹음 없음');return;}
  if(curAudio){curAudio.pause();}
  curAudio=new Audio(r.url);
  setStatus('녹음 재생 중...','play');
  curAudio.play();
  curAudio.onended=()=>setStatus('재생 완료');
}
function chg(type,delta){
  const it=ALL[cur]; if(!it.scorable)return;
  const s=scores[it.key]||{e:0,w:0};
  if(type==='e')s.e=Math.max(0,Math.min(it.eMax,s.e+delta));
  else s.w=Math.max(0,Math.min(it.wMax,s.w+delta));
  scores[it.key]=s;
  document.getElementById(type==='e'?'eNum':'wNum').textContent=type==='e'?s.e:s.w;
}
function showResult(){
  memos[ALL[cur].key]=document.getElementById('memoArea').value;
  const scorables=ALL.filter(it=>it.scorable);
  let te=0,tw=0;
  document.getElementById('rtbody').innerHTML=scorables.map(it=>{
    const s=scores[it.key]||{e:0,w:0}; te+=s.e; tw+=s.w;
    const m=memos[it.key]||'-';
    return `<tr><td style="text-align:left;padding-left:8px">${it.badge}</td><td>${s.e}/${it.eMax}</td><td>${s.w}/${it.wMax}</td><td style="font-size:11px;text-align:left">${m}</td></tr>`;
  }).join('')+`<tr class="total"><td style="text-align:left;padding-left:8px">합계</td><td>${te}/18</td><td>${tw}/25</td><td>-</td></tr>`;
  document.getElementById('mainView').style.display='none';
  document.getElementById('resultView').className='result-screen show';
}
function showMain(){
  document.getElementById('mainView').style.display='block';
  document.getElementById('resultView').className='result-screen';
}
function copyResult(){
  const scorables=ALL.filter(it=>it.scorable);
  let txt='놀이동산 따라말하기 검사 결과\n\n',te=0,tw=0;
  scorables.forEach(it=>{
    const s=scores[it.key]||{e:0,w:0}; te+=s.e; tw+=s.w;
    txt+=`${it.badge}: 어절 ${s.e}/${it.eMax}, 낱말 ${s.w}/${it.wMax}`;
    if(memos[it.key]) txt+=` | ${memos[it.key]}`;
    txt+='\n';
  });
  txt+=`\n합계: 어절 ${te}/18, 낱말 ${tw}/25`;
  navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>alert('복사되었습니다!'));
}
document.getElementById('resultOpenBtn').onclick=showResult;
document.getElementById('memoArea').addEventListener('input',()=>{memos[ALL[cur].key]=document.getElementById('memoArea').value;});
buildTabs(); render();
</script>
</body>
</html>
